name: gourmandly
description: Recipes and shopping lists for the whole kitchen.
publish_to: none

version: 0.1.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  domain:
    path: ../packages/domain
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  fast_immutable_collections: ^12.0.0
  cloud_functions: ^7.0.1
  firebase_storage: ^14.0.1
  wakelock_plus: ^1.8.2
  equatable: ^3.0.0
  web: ^1.1.2
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  glados: ^1.1.7

flutter:
  uses-material-design: true
  fonts:
    - family: Young Serif
      fonts:
        - asset: assets/fonts/YoungSerif-Regular.ttf
    - family: Familjen Grotesk
      fonts:
        - asset: assets/fonts/FamiljenGrotesk-Variable.ttf
